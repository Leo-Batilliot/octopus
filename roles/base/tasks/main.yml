---
- name: Update the apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install useful everyday packages
  ansible.builtin.apt:
    name:
      - vim
      - curl
      - ca-certificates
      - gnupg
      - htop
      - less
      - unzip
      - acl
    state: present
